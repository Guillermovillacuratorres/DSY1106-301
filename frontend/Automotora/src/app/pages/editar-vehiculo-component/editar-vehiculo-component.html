<div class="form-container">
  <h2>Editar de Vehículo</h2>

  
  <div class="form-group">
    <label>Id vehiculo</label>
    <input [(ngModel)]="par_id_vehiculo" type="number" placeholder="" disabled>
  </div>
  
  <div class="form-group">
    <label>Patente</label>
    <input [(ngModel)]="patente" type="text" placeholder="Ej: ABCD-12">
  </div>



  <div class="form-group">
    <label>Color</label>
    <input [(ngModel)]="color" type="text" placeholder="Ej: Rojo">
  </div>

  <div class="form-group">
    <label>Marca</label>
    <input [(ngModel)]="marca" type="text" placeholder="Ej: Toyota">
  </div>

  <div class="form-group">
    <label>Modelo</label>
    <input [(ngModel)]="modelo" type="text" placeholder="Ej: Corolla">
  </div>

  <button class="btn-submit" (click)="editarAuto()">Actualizar auto</button>
</div>
